name: Test AI agent
on: workflow_dispatch:
jobs:
test:
runs-on: ubuntu-latest
steps: 
name: Get my code
uses: actions/ checkout@v4
name: Set up python
uses: actions/setup-python@v5
with: 
python-version: "3.12"
name: run test
env:
OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
run: python test_agent.py
